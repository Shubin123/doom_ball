name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/bundle_ide.mjs
      - name: Assemble static demo
        run: |
          mkdir -p _site/firmware _site/docs
          cp index.html .nojekyll _site/
          cp -R ide sim engine _site/
          cp -R firmware/targets firmware/projects firmware/prebuilt _site/firmware/
          cp firmware/Makefile _site/firmware/
          cp docs/h743-firmware-emulated.png _site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
