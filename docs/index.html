<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM32 Forge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="ide/style.css">
</head>
<body>
<div id="app">
  <header class="toolbar">
    <div class="logo">
      <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 1L18 5.5V14.5L10 19L2 14.5V5.5L10 1Z" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="3" fill="currentColor"/></svg>
      STM32 Forge
    </div>
    <div class="sep"></div>
    <label>Target
      <select id="target">
        <option value="h743">STM32H743IITx — 2 MB flash / 1 MB RAM</option>
        <option value="bluepill">STM32F103C8T6 Blue Pill — 64 KB / 20 KB</option>
      </select>
    </label>
    <label>Project
      <select id="project">
        <option value="doom">DOOM</option>
        <option value="blinky">Blinky</option>
      </select>
    </label>
    <div class="sep"></div>
    <button class="btn" id="btn-save" title="Save (Ctrl+S)" disabled>Save</button>
    <button class="btn primary" id="btn-build" title="Build (Ctrl+B)">Build</button>
    <button class="btn" id="btn-flash" title="Flash the device">Flash…</button>
    <button class="btn" id="btn-serial" title="Open the USART1 console">Connect serial</button>
    <div class="spacer"></div>
    <div class="status" id="server-status"><span class="dot"></span><span>checking build server…</span></div>
  </header>

  <div class="main">
    <aside class="panel files">
      <div class="panel-head">Files</div>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="panel editor">
      <div class="editor-tabs" id="tabs"></div>
      <div class="editor-body" id="editor-body">
        <div class="editor-empty" id="editor-empty">Open a file from the tree.</div>
      </div>
    </section>

    <aside class="panel side">
      <div class="section">
        <div class="panel-head">
          <span>Emulator — DOOM engine (WebAssembly)</span>
          <span class="mono" id="emu-fps"></span>
        </div>
        <div class="section-body">
          <div class="screen">
            <canvas id="screen" width="320" height="200" tabindex="0" aria-label="DOOM emulator screen"></canvas>
            <div class="overlay" id="emu-overlay"></div>
          </div>
          <div class="row">
            <button class="btn primary" id="btn-run">Run</button>
            <button class="btn" id="btn-stop" disabled>Stop</button>
            <label class="check" title="Send your key presses to the real board over the serial console">
              <input type="checkbox" id="pad-hw"> keys → board
            </label>
          </div>
          <div class="hint">
            <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>WASD</kbd> move · <kbd>Ctrl</kbd>/<kbd>F</kbd> fire ·
            <kbd>Space</kbd> use · <kbd>Enter</kbd>/<kbd>Esc</kbd> menu · <kbd>Shift</kbd> run
          </div>
          <div class="hint" id="emu-note"></div>
        </div>
      </div>
      <div class="section">
        <div class="panel-head"><span>Memory</span><span class="mono" id="mem-source"></span></div>
        <div class="section-body" id="memory"></div>
      </div>
    </aside>
  </div>

  <section class="bottom">
    <div class="bottom-tabs" role="tablist">
      <button class="active" data-term="build">Build output</button>
      <button data-term="serial">Serial monitor</button>
      <button data-term="flash">Flash log</button>
      <div class="tools">
        <div class="progress" id="flash-progress" hidden><span></span></div>
        <button class="btn" id="btn-clear">Clear</button>
      </div>
    </div>
    <div class="term active mono" id="term-build"></div>
    <div class="term mono" id="term-serial"></div>
    <div class="term mono" id="term-flash"></div>
    <form class="serial-input" id="serial-form" hidden>
      <input id="serial-line" placeholder="Send to USART1 (Enter)…" autocomplete="off">
      <button class="btn" type="submit">Send</button>
    </form>
  </section>
</div>

<dialog id="flash-dialog">
  <form method="dialog">
    <h3>Flash <span id="fd-what"></span></h3>
    <div id="fd-image" class="hint"></div>
    <label class="custom-firmware">Flash a rebuilt image (.bin)
      <input id="custom-firmware" type="file" accept=".bin,application/octet-stream">
      <small>Choose a rebuilt firmware.bin to flash it. Leave empty to flash the selected built-in image.</small>
    </label>
    <div class="methods">
      <label class="method" id="m-uart">
        <input type="radio" name="method" value="uart" checked>
        <span><b>UART bootloader</b> (Web Serial, both chips)
          <small>USB-UART adapter: TX→PA10, RX→PA9, GND. Hold BOOT0 high and reset the board.</small></span>
      </label>
      <label class="method" id="m-dfu">
        <input type="radio" name="method" value="dfu">
        <span><b>USB DFU</b> (WebUSB, STM32H743 only)
          <small>USB on PA11/PA12. Hold BOOT0 high and reset; the chip appears as 0483:DF11.</small></span>
      </label>
    </div>
    <div class="hint" id="fd-support"></div>
    <div class="actions">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn primary" id="fd-go" value="go">Connect &amp; flash</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gas/gas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="sim/doom.js"></script>
<!-- The static IDE bundle runs in the browser and also supports file:// for the editor demo. -->
<script src="ide/forge.js"></script>
</body>
</html>
